<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>מערכת דיווח תקלות רכב</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #0d1117 0%, #0a0f1a 50%, #060b14 100%);
    font-family: 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
    direction: rtl; color: #e6f1ff;
  }
  .header {
    background: linear-gradient(90deg, #0d1117 0%, #131b2e 100%);
    border-bottom: 2px solid rgba(255,200,50,0.3);
    padding: 16px 20px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-title { color: #ffc832; font-weight: 900; font-size: 18px; letter-spacing: 1px; }
  .header-sub { color: #8892b0; font-size: 11px; margin-top: 2px; }
  .header-btns { display: flex; gap: 8px; }
  .btn-tab { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #8892b0; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-tab.active { background: rgba(255,200,50,0.15); border-color: #ffc832; color: #ffc832; }
  .btn-new { background: rgba(255,200,50,0.08); border: 1px solid rgba(255,200,50,0.3); color: #ffc832; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-weight: 700; font-family: inherit; }
  .btn-new.active { background: rgba(255,200,50,0.15); border-color: #ffc832; }
  .main { max-width: 600px; margin: 0 auto; padding: 20px 16px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .stat-card { background: linear-gradient(135deg, #1a1f2e, #141824); border-radius: 10px; padding: 12px 10px; text-align: center; }
  .stat-num { font-size: 24px; font-weight: 900; }
  .stat-label { color: #8892b0; font-size: 11px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
  .filter-btn { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #8892b0; border-radius: 20px; padding: 5px 14px; font-size: 12px; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .filter-btn.active { background: rgba(255,200,50,0.15); border-color: #ffc832; color: #ffc832; }
  .fault-card { background: linear-gradient(135deg, #1a1f2e 0%, #141824 100%); border: 1px solid rgba(255,200,50,0.18); border-radius: 12px; margin-bottom: 14px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
  .fault-header { padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .fault-vehicle { color: #ffc832; font-weight: 800; font-size: 15px; }
  .fault-serial { color: #8892b0; font-size: 13px; }
  .fault-preview { color: #ccd6f6; font-size: 13px; margin-top: 4px; opacity: 0.8; }
  .fault-body { padding: 0 18px 16px; border-top: 1px solid rgba(255,200,50,0.1); }
  .fault-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-top: 14px; }
  .fault-field-label { color: #8892b0; font-size: 11px; margin-bottom: 2px; }
  .fault-field-val { color: #e6f1ff; font-size: 14px; }
  .fault-desc-box { color: #e6f1ff; font-size: 14px; line-height: 1.6; background: rgba(255,255,255,0.04); border-radius: 8px; padding: 10px 12px; margin-top: 12px; }
  .status-badge { border-radius: 4px; padding: 2px 10px; font-size: 12px; font-weight: 700; letter-spacing: 1px; border: 1px solid; }
  .status-open { color: #ff4d4d; background: rgba(255,77,77,0.15); border-color: #ff4d4d; }
  .status-in_progress { color: #ffb347; background: rgba(255,179,71,0.15); border-color: #ffb347; }
  .status-closed { color: #4dff91; background: rgba(77,255,145,0.15); border-color: #4dff91; }
  .status-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .status-change-btn { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #8892b0; border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .status-change-btn.active { background: rgba(255,200,50,0.2); border-color: #ffc832; color: #ffc832; }
  .fault-id { margin-top: 8px; color: #555; font-size: 11px; }
  .btn-delete { background: rgba(255,77,77,0.1); border: 1px solid rgba(255,77,77,0.3); color: #ff4d4d; border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer; font-family: inherit; margin-top: 12px; width: 100%; }
  .btn-delete:active { background: rgba(255,77,77,0.25); }
  .video-box { margin-top: 12px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,200,50,0.2); }
  .video-box video { width: 100%; display: block; max-height: 260px; background: #000; }
  .empty { text-align: center; padding: 60px 20px; color: #3d4a6b; font-size: 15px; }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .form-card { background: linear-gradient(135deg, #1a1f2e, #141824); border: 1px solid rgba(255,200,50,0.2); border-radius: 16px; padding: 24px 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  .form-title { color: #ffc832; font-weight: 800; font-size: 18px; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,200,50,0.15); }
  .field { margin-bottom: 16px; }
  .field label { display: block; color: #8892b0; font-size: 12px; margin-bottom: 6px; letter-spacing: 0.5px; }
  .field input, .field textarea { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,200,50,0.2); border-radius: 8px; color: #e6f1ff; padding: 11px 14px; font-size: 15px; outline: none; font-family: inherit; direction: rtl; -webkit-appearance: none; appearance: none; }
  .field textarea { resize: vertical; line-height: 1.6; }
  .field input[type="datetime-local"] { color-scheme: dark; }
  .field input::placeholder, .field textarea::placeholder { color: #3d4a6b; }
  .video-drop { border: 2px dashed rgba(255,200,50,0.3); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; background: rgba(255,255,255,0.03); }
  .video-drop.has-video { background: rgba(255,200,50,0.08); border-color: rgba(255,200,50,0.5); }
  .video-drop-icon { font-size: 28px; }
  .video-drop-text { color: #8892b0; margin-top: 8px; font-size: 14px; }
  .video-drop-sub { color: #3d4a6b; font-size: 11px; margin-top: 4px; }
  .video-name { color: #ffc832; margin-top: 6px; font-size: 13px; }
  .btn-submit { width: 100%; background: linear-gradient(135deg, #ffc832, #ff9500); border: none; border-radius: 10px; padding: 15px; color: #000; font-weight: 900; font-size: 16px; cursor: pointer; letter-spacing: 1px; margin-top: 8px; box-shadow: 0 4px 20px rgba(255,200,50,0.3); font-family: inherit; }
  .success-box { text-align: center; padding: 40px 0; }
  .success-icon { font-size: 52px; margin-bottom: 12px; }
  .success-text { color: #4dff91; font-size: 20px; font-weight: 700; }
  .success-sub { color: #8892b0; margin-top: 8px; }
  .tag-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .loading { text-align: center; padding: 40px; color: #8892b0; }
  .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid rgba(255,200,50,0.2); border-top-color: #ffc832; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .online-dot { width: 8px; height: 8px; background: #4dff91; border-radius: 50%; display: inline-block; margin-left: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">🚗 מערכת דיווח תקלות <span class="online-dot"></span></div>
    <div class="header-sub">מחובר לענן · עדכון בזמן אמת</div>
  </div>
  <div class="header-btns">
    <button class="btn-tab active" id="btnList" onclick="showView('list')">📋 תקלות</button>
    <button class="btn-new" id="btnNew" onclick="showView('new')">+ דיווח חדש</button>
  </div>
</div>

<div class="main">
  <div id="viewList">
    <div class="stats" id="statsRow"></div>
    <div class="filter-row" id="filterRow"></div>
    <div id="faultsList"><div class="loading"><div class="spinner"></div><br>טוען נתונים...</div></div>
  </div>
  <div id="viewNew" style="display:none;">
    <div class="form-card">
      <div class="form-title">📝 דיווח תקלה חדשה</div>
      <div id="formContent"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1s8R0yreXQTYrhejMSdo8hHrAQDuTrEg",
  authDomain: "tene-tavor.firebaseapp.com",
  projectId: "tene-tavor",
  storageBucket: "tene-tavor.firebasestorage.app",
  messagingSenderId: "56912977165",
  appId: "1:56912977165:web:51be6b976ffab2b0c2e444"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

let faults = [];
let currentFilter = 'all';
let videoFile = null;
let videoName = '';

const q = query(collection(db, "faults"), orderBy("createdAt", "desc"));
onSnapshot(q, (snapshot) => {
  faults = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  renderList();
});

window.showView = function(v) {
  document.getElementById('viewList').style.display = v === 'list' ? '' : 'none';
  document.getElementById('viewNew').style.display = v === 'new' ? '' : 'none';
  document.getElementById('btnList').className = v === 'list' ? 'btn-tab active' : 'btn-tab';
  document.getElementById('btnNew').className = v === 'new' ? 'btn-new active' : 'btn-new';
  if (v === 'new') buildForm();
}

window.handleVideo = function(input) {
  const file = input.files[0];
  if (!file) return;
  videoFile = file;
  videoName = file.name;
  const url = URL.createObjectURL(file);
  const drop = document.getElementById('videoDrop');
  drop.className = 'video-drop has-video';
  drop.innerHTML = `
    <div class="video-drop-icon">🎥</div>
    <div class="video-name">${file.name}</div>
    <video src="${url}" controls style="width:100%;margin-top:10px;border-radius:8px;max-height:200px"></video>
    <div class="video-drop-sub" style="margin-top:8px">לחץ להחלפה</div>`;
}

window.submitFault = async function() {
  const vehicle = document.getElementById('fVehicle').value.trim();
  const serial = document.getElementById('fSerial').value.trim();
  const company = document.getElementById('fCompany').value.trim();
  const desc = document.getElementById('fDesc').value.trim();
  const time = document.getElementById('fTime').value;
  const driver = document.getElementById('fDriver').value.trim();
  const location = document.getElementById('fLocation').value.trim();

  if (!vehicle || !serial || !company || !desc || !driver) {
    alert('נא למלא את כל השדות החובה (*)');
    return;
  }

  document.getElementById('formContent').innerHTML = `<div class="loading"><div class="spinner"></div><br>שולח דיווח...</div>`;

  try {
    let videoURL = '';
    if (videoFile) {
      const storageRef = ref(storage, `videos/${Date.now()}_${videoName}`);
      await uploadBytes(storageRef, videoFile);
      videoURL = await getDownloadURL(storageRef);
    }

    await addDoc(collection(db, "faults"), {
      vehicle, serialNumber: serial, company,
      faultDescription: desc, reportTime: time,
      driver, location,
      videoName: videoName || '',
      videoURL: videoURL || '',
      status: 'open',
      createdAt: serverTimestamp()
    });

    document.getElementById('formContent').innerHTML = `
      <div class="success-box">
        <div class="success-icon">✅</div>
        <div class="success-text">התקלה דווחה בהצלחה!</div>
        <div class="success-sub">מועבר לרשימה...</div>
      </div>`;
    videoFile = null; videoName = '';
    setTimeout(() => { showView('list'); }, 1800);
  } catch(e) {
    alert('שגיאה בשליחה: ' + e.message);
    buildForm();
  }
}

window.changeStatus = async function(id, status) {
  try {
    await updateDoc(doc(db, "faults", id), { status });
  } catch(e) { alert('שגיאה: ' + e.message); }
}

window.deleteFault = async function(id) {
  if (!confirm('למחוק את הדיווח הזה?')) return;
  try {
    await deleteDoc(doc(db, "faults", id));
  } catch(e) { alert('שגיאה במחיקה: ' + e.message); }
}

window.toggleCard = function(id) {
  const body = document.getElementById('body_' + id);
  const arrow = document.getElementById('arrow_' + id);
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : '';
  arrow.textContent = open ? '▼' : '▲';
}

window.setFilter = function(val) {
  currentFilter = val;
  renderList();
}

function statusLabel(s) {
  return { open: 'פתוח', in_progress: 'בטיפול', closed: 'סגור' }[s] || s;
}

function renderList() {
  const counts = { open: 0, in_progress: 0, closed: 0 };
  faults.forEach(f => { if (counts[f.status] !== undefined) counts[f.status]++; });

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card" style="border:1px solid rgba(255,77,77,0.2)">
      <div class="stat-num" style="color:#ff4d4d">${counts.open}</div>
      <div class="stat-label">פתוחות</div>
    </div>
    <div class="stat-card" style="border:1px solid rgba(255,179,71,0.2)">
      <div class="stat-num" style="color:#ffb347">${counts.in_progress}</div>
      <div class="stat-label">בטיפול</div>
    </div>
    <div class="stat-card" style="border:1px solid rgba(77,255,145,0.2)">
      <div class="stat-num" style="color:#4dff91">${counts.closed}</div>
      <div class="stat-label">סגורות</div>
    </div>`;

  const filters = [['all','הכל'],['open','פתוח'],['in_progress','בטיפול'],['closed','סגור']];
  document.getElementById('filterRow').innerHTML = filters.map(([val, lbl]) =>
    `<button class="filter-btn${currentFilter === val ? ' active' : ''}" onclick="setFilter('${val}')">${lbl}</button>`
  ).join('');

  const filtered = currentFilter === 'all' ? faults : faults.filter(f => f.status === currentFilter);
  const container = document.getElementById('faultsList');

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🚗</div><div>אין תקלות כרגע</div><div style="font-size:12px;margin-top:6px">לחץ על "דיווח חדש" להוספת תקלה</div></div>`;
    return;
  }

  container.innerHTML = filtered.map(f => {
    const preview = (f.faultDescription || '').slice(0, 60) + ((f.faultDescription || '').length > 60 ? '...' : '');
    const timeStr = (f.reportTime || '').replace('T', ' ');
    let createdStr = '';
    if (f.createdAt?.toDate) createdStr = f.createdAt.toDate().toLocaleString('he-IL');
    const videoHTML = f.videoURL
      ? `<div class="video-box"><video src="${f.videoURL}" controls playsinline></video></div>`
      : f.videoName ? `<div style="margin-top:12px;padding:8px 12px;background:rgba(255,200,50,0.08);border-radius:8px;border:1px solid rgba(255,200,50,0.2);color:#ffc832;font-size:13px">🎥 ${f.videoName}</div>` : '';

    return `
    <div class="fault-card">
      <div class="fault-header" onclick="toggleCard('${f.id}')">
        <div style="flex:1;min-width:0">
          <div class="tag-row">
            <span class="fault-vehicle">${f.vehicle || ''}</span>
            <span class="fault-serial">צ׳ ${f.serialNumber || ''}</span>
            <span class="status-badge status-${f.status}">${statusLabel(f.status)}</span>
          </div>
          <div class="fault-preview">${preview}</div>
        </div>
        <div id="arrow_${f.id}" style="color:#8892b0;font-size:18px">▼</div>
      </div>
      <div class="fault-body" id="body_${f.id}" style="display:none">
        <div class="fault-grid">
          <div><div class="fault-field-label">🏢 פלוגה</div><div class="fault-field-val">${f.company || '—'}</div></div>
          <div><div class="fault-field-label">🕐 שעת דיווח</div><div class="fault-field-val">${timeStr || '—'}</div></div>
          <div><div class="fault-field-label">👤 נהג</div><div class="fault-field-val">${f.driver || '—'}</div></div>
          <div><div class="fault-field-label">📍 מיקום</div><div class="fault-field-val">${f.location || '—'}</div></div>
        </div>
        <div class="fault-desc-box">${(f.faultDescription || '').replace(/\n/g,'<br>')}</div>
        ${videoHTML}
        <div class="status-row">
          <span style="color:#8892b0;font-size:12px">שנה סטטוס:</span>
          ${['open','in_progress','closed'].map(s =>
            `<button class="status-change-btn${f.status===s?' active':''}" onclick="changeStatus('${f.id}','${s}')">${statusLabel(s)}</button>`
          ).join('')}
        </div>
        <div class="fault-id">${createdStr}</div>
        <button class="btn-delete" onclick="deleteFault('${f.id}')">🗑️ מחק דיווח</button>
      </div>
    </div>`;
  }).join('');
}

function buildForm() {
  const now = new Date();
  const local = new Date(now - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  videoFile = null; videoName = '';
  document.getElementById('formContent').innerHTML = `
    <div class="field"><label>🚗 סוג כלי הרכב *</label>
      <input type="text" id="fVehicle" placeholder="הכנס סוג רכב..."></div>
    <div class="field"><label>🔢 מספר צ׳ *</label>
      <input type="text" id="fSerial" placeholder="הכנס מספר צ׳..."></div>
    <div class="field"><label>🏢 פלוגה *</label>
      <input type="text" id="fCompany" placeholder="הכנס שם פלוגה..."></div>
    <div class="field"><label>📋 מהות התקלה *</label>
      <textarea id="fDesc" rows="4" placeholder="תאר את התקלה בפירוט..."></textarea></div>
    <div class="field"><label>🕐 שעת דיווח</label>
      <input type="datetime-local" id="fTime" value="${local}"></div>
    <div class="field"><label>👤 נהג בזמן התקלה *</label>
      <input type="text" id="fDriver" placeholder="שם הנהג..."></div>
    <div class="field"><label>📍 מיקום</label>
      <input type="text" id="fLocation" placeholder="איפה קרתה התקלה?"></div>
    <div class="field"><label>🎥 סרטון התקלה (אופציונלי)</label>
      <div class="video-drop" id="videoDrop" onclick="document.getElementById('fVideo').click()">
        <div class="video-drop-icon">📱</div>
        <div class="video-drop-text">לחץ לבחירת סרטון</div>
        <div class="video-drop-sub">MP4, MOV, AVI</div>
      </div>
      <input type="file" id="fVideo" accept="video/*" style="display:none" onchange="handleVideo(this)"></div>
    <button class="btn-submit" onclick="submitFault()">📤 שלח דיווח תקלה</button>`;
}

buildForm();
</script>
</body>
</html>
